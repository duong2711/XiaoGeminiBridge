name: Build Gemini Home Restore APK
on:
  push:
    branches: [main, feature/gemini-restore-micts-switch, fix/gemini-restore-persist-mode, experiment/home-gemini-legacy-autorestore-20261102]
    paths:
      - 'gemini-restore-switch/**'
      - '.github/workflows/build-gemini-restore-switch.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gemini-restore-switch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Gemini-Home-Restore-Legacy-v4.6-APK
          path: gemini-restore-switch/app/build/outputs/apk/debug/*.apk
      - name: Publish APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Gemini-Home-Restore-v4.4.apk
          if gh release view v4.4.0-home >/dev/null 2>&1; then
            gh release upload v4.4.0-home Gemini-Home-Restore-v4.4.apk --clobber
          else
            gh release create v4.4.0-home Gemini-Home-Restore-v4.4.apk \
              --title 'Gemini Home Restore v4.4 - Home only' \
              --notes 'Home-only version: removed MiCTS, power-button and assistant switching features. Requires user-approved WRITE_SETTINGS; HyperOS may restrict this setting even with permission.'
          fi

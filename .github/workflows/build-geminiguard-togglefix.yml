name: Build patched GeminiGuard (Accessibility OFF fix)
on:
  push:
    branches: [feature/geminiguard-toggle-fix]
    paths:
      - 'geminiguard-fix/**'
      - '.github/workflows/build-geminiguard-togglefix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original public GeminiGuard source
        shell: bash
        run: |
          set -euo pipefail
          curl -fSL --retry 3 -o upstream.zip \
            https://raw.githubusercontent.com/minhdat5122010-dev/GeminiGuard/main/GeminiGuard-v2.0.zip
          unzip -t upstream.zip | tail -n 2
          unzip -q upstream.zip
          test -f GeminiGuard/app/src/main/java/com/gemini/guard/AccToggle.kt
      - name: Apply no-auto-reactivation patch
        shell: bash
        run: |
          cp geminiguard-fix/AccToggle.kt GeminiGuard/app/src/main/java/com/gemini/guard/AccToggle.kt
          python3 geminiguard-fix/apply_fix.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile patched debug APK
        run: cd GeminiGuard && gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GeminiGuard-4.0.1-Accessibility-toggle-fix
          path: GeminiGuard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

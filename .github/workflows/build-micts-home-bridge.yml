name: Build MiCTS Home Bridge APK
on:
  push:
    branches: [experiment/micts-home-assist-bridge-20261102]
    paths:
      - 'micts-home-bridge/**'
      - '.github/workflows/build-micts-home-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: micts-home-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MiCTS-Home-Bridge-v1.0-experimental-APK
          path: micts-home-bridge/app/build/outputs/apk/debug/*.apk

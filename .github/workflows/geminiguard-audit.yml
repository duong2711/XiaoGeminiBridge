name: GeminiGuard source audit
on:
  push:
    branches: [feature/geminiguard-toggle-fix]
    paths: ['.github/workflows/geminiguard-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve public GeminiGuard source
        run: |
          curl --fail --location --retry 3 -o upstream-source.zip \
            https://raw.githubusercontent.com/minhdat5122010-dev/GeminiGuard/main/GeminiGuard-v2.0.zip
          unzip -t upstream-source.zip | tail -n 2
      - uses: actions/upload-artifact@v4
        with:
          name: GeminiGuard-upstream-source-for-audit
          path: upstream-source.zip
          if-no-files-found: error
